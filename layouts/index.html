{{ define "main" }}
  {{ $partial := print "home/" .Site.Params.homepage.layout ".html" }}
  {{ if templates.Exists (printf "partials/%s" $partial) }}
    {{ partial $partial . }}
  {{ else }}
    {{ partial "home/profile.html" . }}
  {{ end }}

  <canvas id="voronoi-bg" aria-hidden="true"></canvas>

  <!-- d3-delaunay (Voronoi) -->
  <script defer src="https://cdn.jsdelivr.net/npm/d3-delaunay@6"></script>
  <script defer src="/js/voronoi-bg.js"></script>
{{ end }}
